name: Bug Report
description: Report a broken link, rendering issue, or code error in the book
labels: ["bug"]
body:
  - type: input
    id: chapter
    attributes:
      label: Chapter
      placeholder: e.g., 3.1 Crop Mapping
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Issue type
      options:
        - Broken link
        - Rendering / display issue
        - Code error
        - Outdated content
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What's wrong and where?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen instead?
