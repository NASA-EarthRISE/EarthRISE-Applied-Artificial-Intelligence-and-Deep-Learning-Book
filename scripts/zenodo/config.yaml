book:
  title: "EarthRISE Applied Artificial Intelligence and Deep Learning Book"
  year: 2026
  license: "cc-by-4.0"
  language: "eng"
  community: "nasa-earthrise"
  github_url: "https://github.com/NASA-EarthRISE/EarthRISE-Applied-Artificial-Intelligence-and-Deep-Learning-Book"
  authors:
    - name: "Mayer, Tim"
      orcid: "0000-0001-9489-9392"
      affiliation: "NASA EarthRISE; University of Alabama in Huntsville"
    - name: "Bhandari, Biplov"
      orcid: "0000-0001-6169-8236"
      affiliation: "Earth Resources Technology"
    - name: "Saah, David"
      orcid: "0000-0001-9999-1219"
      affiliation: "University of San Francisco; Spatial Informatics Group"
  description: >
    <p>The NASA EarthRISE Applied Artificial Intelligence and Deep Learning Book
    provides practitioners with applied examples of Remote Sensing AI and Deep
    Learning across NASA Earth Action thematic areas. Each chapter focuses on a
    specific problem domain -- semantic segmentation, time series analysis,
    ecological process simulation, and foundation model evaluation -- combining
    theoretical background with practical hands-on Jupyter notebooks.</p>
    <p>The book spans multiple frameworks (TensorFlow, PyTorch) and thematic
    areas including agriculture, forestry, fire ecology, and geospatial AI
    foundation model evaluation.</p>
  keywords:
    - deep learning
    - remote sensing
    - GeoAI
    - earth observation
    - NASA
    - EarthRISE
    - semantic segmentation
    - time series
    - foundation models
    - Jupyter notebooks
    - applied AI

chapters:
  - id: ch3.1
    title: "Crop Mapping: Rice Mapping in Bhutan"
    notebook: "03_Semantic_Segmentation/01__Crop_Mapping/notebooks/Rice_Mapping_Bhutan_2021.ipynb"
    pdf_folder: "Crop Mapping Rice Mapping in Bhutan"
    authors:
      - name: "Bhandari, Biplov"
        orcid: "0000-0001-6169-8236"
        affiliation: "Earth Resources Technology; ERT, Inc"
      - name: "Mayer, Tim"
        orcid: "0000-0001-9489-9392"
        affiliation: "NASA; University of Alabama in Huntsville"
    description: >
      <p>This chapter demonstrates semantic segmentation for crop type mapping,
      using Bhutan rice paddy mapping as the applied case study. It covers deep
      learning model development, training strategies, and evaluation using
      satellite imagery and Earth observation data.</p>
      <p>Part of the <em>EarthRISE Applied Artificial Intelligence and Deep
      Learning Book</em>, Chapter 3: Semantic Segmentation.</p>
    keywords:
      - crop mapping
      - rice mapping
      - semantic segmentation
      - Bhutan
      - agriculture
      - deep learning
      - remote sensing

  - id: ch3.2
    title: "Selective Logging Detection with Deep Learning and Very-High Resolution Imagery"
    notebook: "03_Semantic_Segmentation/02__Selective_Logging_Detection/notebooks/Selective_Logging_Detection.ipynb"
    pdf_folder: "Selective_Logging_Detection"
