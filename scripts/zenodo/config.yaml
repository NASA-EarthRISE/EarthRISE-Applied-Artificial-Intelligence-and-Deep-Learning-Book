      - name: "Quispe, Marvin"
        orcid: "0000-0003-1427-6799"
        affiliation: "Conservación Amazónica - ACCA"
    description: >
      <p>This chapter applies deep learning semantic segmentation to detect
      selective logging events in tropical forests using very-high resolution
      satellite imagery. It covers data preparation, U-Net model training,
      and end-to-end inference workflows.</p>
      <p>Part of the <em>EarthRISE Applied Artificial Intelligence and Deep
      Learning Book</em>, Chapter 3: Semantic Segmentation.</p>
    keywords:
      - selective logging
      - deforestation
      - semantic segmentation
      - very-high resolution
      - U-Net
      - tropical forest
      - remote sensing

