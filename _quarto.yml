project:
  type: book

profile:
  default: book

lang: en

book:
  title: "Applied Artificial Intelligence and Deep Learning Book"
  # author:
  #   - name: Tim Mayer
  #     affiliations:
  #       - id: nasa-earthrise
  #         name: NASA - EarthRISE
  #       - id: UofA-huntsville
  #         name: The University of Alabama in Huntsville
  #   - name: Biplov Bhandari
  #     affiliations:
  #       - id: ert
  #         name: Earth Resources Technology
  #   - name: David Saah
  #     affiliations:
  #       - id: USF
  #         name: University of San Francisco
  #       - id: spatial-informatics-group
  #         name: Spatial Informatics Group

  date: "6/1/2026"
  description: "A practitioner's guide to applied deep learning for Earth observation, covering semantic segmentation, time series, and foundation models."
  cover-image: Images/Book_Cover.png
  favicon: Images/favicon.png
  open-graph: true
  twitter-card: true
  site-url: https://nasa-earthrise.github.io/EarthRISE-Applied-Artificial-Intelligence-and-Deep-Learning-Book/
  repo-url: https://github.com/NASA-EarthRISE/EarthRISE-Applied-Artificial-Intelligence-and-Deep-Learning-Book
  repo-actions: [source, edit, issue]
  downloads: [pdf]
  search: true
  page-footer:
    center: "Part of the [Geo-AI Working Group](https://tinyurl.com/geo-ai-wg) · [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)"

bibliography: references.bib

format:
  html:
    number-sections: false
    back-to-top-navigation: true
    link-external-newwindow: true
    smooth-scroll: true
    theme:
      light: flatly
      dark: darkly
    lightbox: auto
    comments:
      giscus:
        repo: NASA-EarthRISE/EarthRISE-Applied-Artificial-Intelligence-and-Deep-Learning-Book
    include-in-header:
      - _includes/ga.html
      - _includes/schema.html
  pdf:
      number-sections: false
      documentclass: scrreprt
      code-fold: false
      output-fold: false
      keep-tex: false
      fig-format: png
      header-includes:
        - \usepackage{graphicx}
        - \newenvironment{CSLReferences}[2]{}{}
        - \usepackage{fvextra}
        - \DefineVerbatimEnvironment{Highlighting}{Verbatim}{breaklines,commandchars=\\\{\}}

execute:
  enabled: false
  freeze: auto
