  #         name: Spatial Informatics Group

  date: "6/1/2026"
  description: "A practitioner's guide to applied deep learning for Earth observation, covering semantic segmentation, time series, and foundation models."
  cover-image: Images/Book_Cover.png
  favicon: Images/favicon.png
  open-graph: true
  twitter-card: true
  site-url: https://nasa-earthrise.github.io/EarthRISE-Applied-Artificial-Intelligence-and-Deep-Learning-Book/
  repo-url: https://github.com/NASA-EarthRISE/EarthRISE-Applied-Artificial-Intelligence-and-Deep-Learning-Book
  repo-actions: [source, edit, issue]
  downloads: [pdf]
  search: true
  page-footer:
    center: "Part of the [Geo-AI Working Group](https://tinyurl.com/geo-ai-wg) · [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)"
  chapters:
      - index.md
      - part: "2. Data Preparation (coming soon)"
        chapters:
          - 02_Data_Preparation/index.ipynb
      - part: "3. Semantic Segmentation"
        chapters:
          - 03_Semantic_Segmentation/01__Crop_Mapping/notebooks/Rice_Mapping_Bhutan_2021.ipynb
          - 03_Semantic_Segmentation/02__Selective_Logging_Detection/notebooks/Selective_Logging_Detection.ipynb
          - 03_Semantic_Segmentation/03__Clay_Deforestation_Segmentation_Model/notebooks/ClayDeforestationv3.ipynb
      - part: "4. Object Detection (coming soon)"
        chapters:
          - 04_Object_Detection/index.ipynb
      - part: "5. Time Series"
        chapters:
          - 05_Time_Series/01__Soybean_Yield_Prediction/notebooks/Crop_yield_estimationR4.ipynb
      - part: "6. Ecological Process Simulation"
        chapters:
          - 06_Eco_Process_Sim/01__Active_Fire_Detection/notebooks/BNN_Active_Fire_Detection.ipynb
      - part: "7. Transfer Learning (coming soon)"
        chapters:
          - 07_Transfer_Learning/index.ipynb
      - part: "8. Fusion (coming soon)"
        chapters:
          - 08_Fusion/index.ipynb
      - part: "9. Downscaling (coming soon)"
        chapters:
          - 09_Downscaling/index.ipynb
      - part: "10. Future of Deep Learning and Foundation Models"
        chapters:
          - 10_Future/01__Evaluating_Foundation_Models_Trained_with_Earth_Observation_Data/notebooks/Chapter_Practical_EOFM_Evaluation.ipynb
      - part: "11. Ethics (coming soon)"
        chapters:
          - 11_Ethics/index.ipynb
      - part: "12. Conclusions (coming soon)"
        chapters:
          - 12_Conclusions/index.ipynb
      - citing.qmd
      - references.qmd

bibliography: references.bib

format:
  html:
    number-sections: false
    back-to-top-navigation: true
    link-external-newwindow: true
    smooth-scroll: true
    theme:
      light: flatly
      dark: darkly
    lightbox: auto
    comments:
      giscus:
        repo: NASA-EarthRISE/EarthRISE-Applied-Artificial-Intelligence-and-Deep-Learning-Book
    include-in-header:
      - _includes/ga.html
      - _includes/schema.html
  pdf:
      number-sections: false
      documentclass: scrreprt
      code-fold: false
      output-fold: false
      keep-tex: false
      fig-format: png
      header-includes:
        - \usepackage{graphicx}
        - \newenvironment{CSLReferences}[2]{}{}
        - \usepackage{fvextra}
        - \DefineVerbatimEnvironment{Highlighting}{Verbatim}{breaklines,commandchars=\\\{\}}

execute:
  enabled: false
  freeze: auto
